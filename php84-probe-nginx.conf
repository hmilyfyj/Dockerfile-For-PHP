worker_processes 1;
error_log /dev/stderr;
pid /tmp/runtime-probe-nginx.pid;
events { worker_connections 16; }
http {
    access_log off;
    server {
        listen 127.0.0.1:18080;
        location = /php84-runtime-smoke.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /tmp/php84-runtime-smoke.php;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
